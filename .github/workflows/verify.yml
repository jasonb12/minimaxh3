name: Verify
on: [push, pull_request]
jobs:
  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q app.py job_store.py generate.py spark.py turbo.py
      - run: python -m unittest discover -s tests -p test_job_store.py
